name: Daily Auto Contribution

# Jadwal otomatis dinonaktifkan sementara (PAUSED)
# Jika ingin mengaktifkan kembali, hapus tanda '#' pada baris schedule dan cron di bawah:
# on:
#   schedule:
#     - cron: '0 3 * * *'
on:
  workflow_dispatch: # Hanya bisa dijalankan manual jika diinginkan

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git User
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Run Daily Commit Script
        run: |
          python daily.py

      - name: Push Commits to GitHub
        run: |
          git push origin main || git push origin master
